<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="images/logo.png">
    
    <link rel="stylesheet" href="css/template.css">
    <link rel="stylesheet" href="css/hamburgerMenu.css">
    <link rel="stylesheet" href="css/content.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>Bryan's Café - Contact</title>
</head>
<body>
    <div class="container-fluid">
        <div class="mobileMenuContainer">
            <input title="toggler" type="checkbox" class="toggler">
            <div class="mobileButtonStyle hamburger perfectCenter">
                <div></div>
            </div>
            <div class="mobileMenuModal mobileMenu">
                <ul>
                    <li><a href="index.html">About</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>

        <nav>
            <a href="index.html">
                <img id="logo" src="images/logo.png" alt="Bryan's Cafe Logo">
            </a>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link" href="index.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="mainWrapper">
            <main class="container">
                
                <h1 class="mt-4">Contact us</h1>
                <div class="row">
                    <form class="registrationForm" name="registrationForm" action="processes/processRegisterCustomer.php" method="post">
                        <fieldset>
                            <div class="inputGroup">
                                <label for="firstname">First name<sup>*</sup>:</label>
                                <input type="text" id="firstname" name="firstname" required>
                            </div>
                            <div class="inputGroup">
                                <label for="lastname">Last name<sup>*</sup>:</label>
                                <input type="text" id="lastname" name="lastname" required>
                            </div>
                            <div class="inputGroup">
                                <label for="emailAddress">Email Address<sup>*</sup>:</label>
                                <input type="email" id="emailAddress" name="emailAddress" required>
                            </div>
                            <div class="inputGroup">
                                <label for="subject">Message subject<sup>*</sup>:</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>
                            <div class="inputGroup">
                                <label for="message">Message body<sup>*</sup>:</label>
                                <input type="text" id="message" name="message" required>
                            </div>

                            <button type="button" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#exampleModal">
                                Submit
                            </button>

                            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content text-dark">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="exampleModalLabel">Success</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Message sent!
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                    </form>
                </div>

                <h1 class="mt-5 mb-4">Our branches</h1>
                
                <div class="bg-light p-4 mb-5 rounded shadow-sm mx-auto w-100" style="max-width: 1000px; color: black;">
                    <div class="row fw-bold d-none d-md-flex mb-3 border-bottom pb-2">
                        <div class="col-md-3">Address</div>
                        <div class="col-md-2">Contact</div>
                        <div class="col-md-4">Opening Hours</div>
                        <div class="col-md-3">Location</div>
                    </div>
                    <div id="branchesContainer"></div>
                </div>

            </main>
        </div>

        <footer>
            &copy;<span id="currentYear"></span> Bryan's Café | <a href="privacyPolicy.html" target="_blank">Privacy Policy</a>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/branches.js"></script>
</body>
</html>
